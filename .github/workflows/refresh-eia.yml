name: Monthly EIA-860M refresh

# Runs on the 26th of each month (EIA-860M typically drops on the ~24th).
# Manual trigger also available via the Actions tab.
on:
  schedule:
    - cron: "0 13 26 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pandas openpyxl

      - name: Run EIA ingest
        run: python3 scripts/ingest_eia.py

      - name: Build change log (diff vs. last committed dataset)
        id: changelog
        run: |
          SUMMARY=$(python3 scripts/build_changelog.py)
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

      - name: Rebuild state / operator pages, explore hub, sitemap
        run: python3 scripts/build_pages.py

      - name: Check for changes
        id: diff
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(data): monthly EIA-860M refresh"
          title: "Monthly EIA-860M refresh"
          body: |
            Automated PR from the `refresh-eia` workflow.

            - Pulled latest EIA-860M archive
            - Re-ingested operating + planned BESS projects
            - Preserved hand-curated entries (ids not starting with `eia-`)
            - Rebuilt `changelog.json` — **${{ steps.changelog.outputs.summary }}**
            - Regenerated state & operator pages, explore hub, sitemap (stale counts fixed; orphaned operator pages pruned → 301)

            Review the diff, then merge — pushing to `main` will auto-deploy to usenergymap.com.
          branch: data/eia-refresh
          delete-branch: true
          add-paths: |
            projects.json
            changelog.json
            state/
            operator/
            explore.html
            sitemap.xml
            robots.txt
            vercel.json
