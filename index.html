<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>US Data Center & BESS Project Tracker</title>
<meta name="description" content="Interactive map of operating, under-construction, and planned data centers and battery energy storage (BESS) projects across the United States." />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --dc: #3b82f6;
    --bess: #22c55e;
    --op: #22c55e;
    --uc: #f59e0b;
    --pl: #a855f7;
    --border: #334155;
    --shadow: 0 10px 25px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
  }

  header {
    position: absolute; top: 0; left: 0; right: 0;
    height: 56px;
    background: linear-gradient(90deg, #0b1224 0%, #1e293b 100%);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    z-index: 1000;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  header h1 .accent { color: var(--accent); }
  header .meta { font-size: 12px; color: var(--muted); }

  #layout {
    position: absolute;
    top: 56px;
    left: 0;
    right: 0;
    bottom: 0;
    display: grid;
    grid-template-columns: 360px 1fr;
  }

  #sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #sidebar-filters {
    padding: 16px;
    overflow-y: auto;
    flex: 0 0 auto;
    max-height: 65%;
  }
  #sidebar-list {
    flex: 1 1 auto;
    border-top: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px 14px 16px 14px;
  }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }
  .stat {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
  }
  .stat .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat .value { font-size: 17px; font-weight: 700; margin-top: 1px; }
  .stat .sub { font-size: 10px; color: var(--muted); margin-top: 1px; }

  .filter-group { margin-bottom: 13px; }
  .filter-group h3 {
    margin: 0 0 6px 0;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.7px;
    font-weight: 600;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11.5px;
    cursor: pointer;
    user-select: none;
    transition: all 0.12s ease;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #0b1224;
    font-weight: 600;
  }

  select, input[type="text"], input[type="range"], input[type="number"] {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 9px;
    border-radius: 6px;
    font-size: 12.5px;
    font-family: inherit;
  }
  select:focus, input:focus { outline: 2px solid var(--accent); }

  .range-wrap { display: flex; align-items: center; gap: 8px; }
  .range-wrap input[type="range"] { flex: 1; padding: 0; }
  .range-val { font-size: 11px; color: var(--muted); min-width: 64px; text-align: right; }

  .year-wrap {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    align-items: center;
  }
  .year-wrap label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    display: block;
    margin-bottom: 3px;
  }

  #reset {
    margin-top: 2px;
    width: 100%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
  }
  #reset:hover { border-color: var(--accent); color: var(--accent); }

  /* Project list */
  .list-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .list-head h3 {
    margin: 0;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.7px;
    font-weight: 600;
  }
  .list-head select {
    width: auto;
    padding: 3px 22px 3px 8px;
    font-size: 11px;
  }

  .plist { display: flex; flex-direction: column; gap: 5px; }
  .pitem {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--dc);
    border-radius: 6px;
    padding: 7px 9px;
    cursor: pointer;
    transition: all 0.1s ease;
  }
  .pitem.bess { border-left-color: var(--bess); }
  .pitem:hover { border-color: var(--accent); background: #2c3a52; }
  .pitem .pname {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
    line-height: 1.25;
  }
  .pitem .pmeta {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .pitem .pmw { color: var(--text); font-weight: 600; }
  .pitem .pstatus {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 999px;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .pstatus.operating { background: rgba(34,197,94,0.18); color: #4ade80; }
  .pstatus.under_construction { background: rgba(245,158,11,0.18); color: #fbbf24; }
  .pstatus.planned { background: rgba(168,85,247,0.18); color: #c084fc; }
  .pstatus.announced { background: rgba(56,189,248,0.18); color: #38bdf8; }

  .empty { color: var(--muted); font-size: 12px; padding: 14px 4px; text-align: center; }

  #map {
    width: 100%;
    height: 100%;
    background: #1a2236;
  }

  .marker-dot {
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.35);
  }

  .leaflet-popup-content-wrapper {
    background: var(--panel);
    color: var(--text);
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .leaflet-popup-tip { background: var(--panel); }
  .leaflet-popup-content { margin: 12px 14px; line-height: 1.4; font-size: 13px; }
  .popup-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; color: #fff; }
  .popup-sub { color: var(--muted); font-size: 11px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.4px; }
  .popup-row { display: flex; justify-content: space-between; gap: 12px; margin: 2px 0; }
  .popup-row .k { color: var(--muted); }
  .popup-row .v { color: var(--text); font-weight: 500; }
  .popup-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .badge-operating { background: rgba(34,197,94,0.18); color: #4ade80; }
  .badge-under_construction { background: rgba(245,158,11,0.18); color: #fbbf24; }
  .badge-planned { background: rgba(168,85,247,0.18); color: #c084fc; }
  .badge-announced { background: rgba(56,189,248,0.18); color: #38bdf8; }

  .popup-link {
    color: var(--accent);
    text-decoration: none;
    font-size: 12px;
    margin-top: 6px;
    display: inline-block;
  }
  .popup-link:hover { text-decoration: underline; }

  .legend {
    font-size: 11px;
    color: var(--text);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px 8px;
  }
  .legend .row { display: flex; align-items: center; gap: 6px; }
  .legend .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #fff; }

  @media (max-width: 768px) {
    #layout { grid-template-columns: 1fr; grid-template-rows: 50% 50%; }
    #sidebar { border-right: none; border-bottom: 1px solid var(--border); }
    #sidebar-filters { max-height: 60%; }
    header h1 { font-size: 14px; }
    header .meta { display: none; }
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1><span class="accent">⚡</span> US Data Center &amp; BESS Tracker</h1>
  <div class="meta" id="updated">Loading…</div>
</header>

<div id="layout">
  <aside id="sidebar">

    <div id="sidebar-filters">
      <div class="stats">
        <div class="stat">
          <div class="label">Projects</div>
          <div class="value" id="stat-count">—</div>
          <div class="sub" id="stat-count-sub">of —</div>
        </div>
        <div class="stat">
          <div class="label">Total Capacity</div>
          <div class="value" id="stat-mw">—</div>
          <div class="sub">MW</div>
        </div>
      </div>

      <div class="filter-group">
        <h3>Type</h3>
        <div class="chips" id="filter-type">
          <span class="chip active" data-val="all">All</span>
          <span class="chip" data-val="data_center">Data Center</span>
          <span class="chip" data-val="bess">BESS</span>
        </div>
      </div>

      <div class="filter-group">
        <h3>Status</h3>
        <div class="chips" id="filter-status">
          <span class="chip active" data-val="all">All</span>
          <span class="chip" data-val="operating">Operating</span>
          <span class="chip" data-val="under_construction">Under Construction</span>
          <span class="chip" data-val="planned">Planned</span>
        </div>
      </div>

      <div class="filter-group">
        <h3>State</h3>
        <select id="filter-state">
          <option value="all">All states</option>
        </select>
      </div>

      <div class="filter-group">
        <h3>Minimum Capacity (MW)</h3>
        <div class="range-wrap">
          <input type="range" id="filter-mw" min="0" max="2000" step="50" value="0" />
          <div class="range-val" id="filter-mw-val">0+ MW</div>
        </div>
      </div>

      <div class="filter-group">
        <h3>Year Online</h3>
        <div class="year-wrap">
          <div>
            <label>From</label>
            <input type="range" id="year-min" />
          </div>
          <div>
            <label>To</label>
            <input type="range" id="year-max" />
          </div>
        </div>
        <div class="range-val" id="year-val" style="text-align:left;margin-top:4px;">—</div>
      </div>

      <div class="filter-group">
        <h3>Search</h3>
        <input type="text" id="filter-search" placeholder="Name, operator, city…" />
      </div>

      <button id="reset">Reset filters</button>

      <div class="filter-group" style="margin-top: 14px; margin-bottom: 0;">
        <h3>Legend</h3>
        <div class="legend">
          <div class="row"><span class="dot" style="background: var(--dc);"></span> Data Center</div>
          <div class="row"><span class="dot" style="background: var(--bess);"></span> BESS</div>
          <div class="row"><span class="dot" style="background: #fff; border-color: var(--op);"></span> Operating</div>
          <div class="row"><span class="dot" style="background: #fff; border-color: var(--uc);"></span> Under Const.</div>
          <div class="row"><span class="dot" style="background: #fff; border-color: var(--pl);"></span> Planned</div>
        </div>
      </div>
    </div>

    <div id="sidebar-list">
      <div class="list-head">
        <h3>Projects <span id="list-count" style="color:var(--text);font-weight:700;"></span></h3>
        <select id="list-sort">
          <option value="mw-desc">MW high→low</option>
          <option value="mw-asc">MW low→high</option>
          <option value="year-desc">Year new→old</option>
          <option value="year-asc">Year old→new</option>
          <option value="name-asc">Name A→Z</option>
        </select>
      </div>
      <div class="plist" id="plist"></div>
    </div>

  </aside>

  <main>
    <div id="map"></div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
(async function () {
  let data;
  try {
    const res = await fetch('projects.json', { cache: 'no-cache' });
    data = await res.json();
  } catch (err) {
    document.getElementById('map').innerHTML =
      '<div style="padding:24px;color:#fca5a5;">Failed to load projects.json — make sure it is in the same folder as index.html.</div>';
    console.error(err);
    return;
  }

  const projects = data.projects || [];
  document.getElementById('updated').textContent =
    `${projects.length} projects · updated ${data.last_updated || '—'}`;

  // ---------- Map ----------
  const map = L.map('map', {
    center: [39.5, -98.35],
    zoom: 4,
    minZoom: 3,
    maxZoom: 12,
    worldCopyJump: false,
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19,
  }).addTo(map);

  const cluster = L.markerClusterGroup({
    showCoverageOnHover: false,
    spiderfyOnMaxZoom: true,
    maxClusterRadius: 40,
  });
  map.addLayer(cluster);

  // ---------- Marker helpers ----------
  const TYPE_COLOR = { data_center: '#3b82f6', bess: '#22c55e' };
  const STATUS_RING = {
    operating: '#22c55e',
    under_construction: '#f59e0b',
    planned: '#a855f7',
    announced: '#38bdf8',
  };

  function radiusFor(mw) {
    if (!mw) return 6;
    return Math.max(6, Math.min(30, Math.round(Math.sqrt(mw) * 0.9)));
  }

  function statusLabel(s) {
    return ({
      operating: 'Operating',
      under_construction: 'Under Construction',
      planned: 'Planned',
      announced: 'Announced',
    })[s] || s;
  }

  function popupHTML(p) {
    const typeLabel = p.type === 'data_center' ? 'Data Center' : 'BESS';
    const mwhRow = p.capacity_mwh
      ? `<div class="popup-row"><span class="k">Energy</span><span class="v">${p.capacity_mwh.toLocaleString()} MWh</span></div>` : '';
    const yearRow = p.year_online
      ? `<div class="popup-row"><span class="k">${p.status === 'operating' ? 'Online' : 'Target'}</span><span class="v">${p.year_online}</span></div>` : '';
    const sourceRow = p.source
      ? `<a class="popup-link" href="${p.source}" target="_blank" rel="noopener noreferrer">Source ↗</a>` : '';
    return `
      <div class="popup-title">${p.name}</div>
      <div class="popup-sub">${typeLabel} · ${p.city}, ${p.state}</div>
      <div class="popup-row"><span class="k">Operator</span><span class="v">${p.operator || '—'}</span></div>
      <div class="popup-row"><span class="k">Capacity</span><span class="v">${p.capacity_mw ? p.capacity_mw.toLocaleString() + ' MW' : '—'}</span></div>
      ${mwhRow}
      ${yearRow}
      <div class="popup-row" style="margin-top:6px;">
        <span class="k">Status</span>
        <span class="popup-badge badge-${p.status}">${statusLabel(p.status)}</span>
      </div>
      ${sourceRow}
    `;
  }

  function makeMarker(p) {
    const fill = TYPE_COLOR[p.type] || '#94a3b8';
    const ring = STATUS_RING[p.status] || '#fff';
    const r = radiusFor(p.capacity_mw);
    const icon = L.divIcon({
      className: '',
      html: `<div class="marker-dot" style="
        width:${r * 2}px;height:${r * 2}px;
        background:${fill};
        border-color:${ring};
      "></div>`,
      iconSize: [r * 2, r * 2],
      iconAnchor: [r, r],
    });
    const marker = L.marker([p.lat, p.lng], { icon });
    marker.bindPopup(popupHTML(p), { maxWidth: 280 });
    marker._project = p;
    return marker;
  }

  const allMarkers = projects.map(makeMarker);
  const markerById = new Map(allMarkers.map(m => [m._project.id, m]));

  // ---------- State filter dropdown ----------
  const stateSel = document.getElementById('filter-state');
  const states = [...new Set(projects.map(p => p.state))].sort();
  states.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    stateSel.appendChild(opt);
  });

  // ---------- Year range slider setup ----------
  const years = projects.map(p => p.year_online).filter(Boolean);
  const minYear = Math.min(...years);
  const maxYear = Math.max(...years);
  const yMin = document.getElementById('year-min');
  const yMax = document.getElementById('year-max');
  const yVal = document.getElementById('year-val');
  [yMin, yMax].forEach(el => {
    el.min = minYear;
    el.max = maxYear;
    el.step = 1;
  });
  yMin.value = minYear;
  yMax.value = maxYear;

  // ---------- Filter state ----------
  const filters = {
    type: 'all',
    status: 'all',
    state: 'all',
    minMw: 0,
    minYear: minYear,
    maxYear: maxYear,
    search: '',
    sort: 'mw-desc',
  };

  function passes(p) {
    if (filters.type !== 'all' && p.type !== filters.type) return false;
    if (filters.status !== 'all' && p.status !== filters.status) return false;
    if (filters.state !== 'all' && p.state !== filters.state) return false;
    if (filters.minMw > 0 && (p.capacity_mw || 0) < filters.minMw) return false;
    if (p.year_online && (p.year_online < filters.minYear || p.year_online > filters.maxYear)) return false;
    if (filters.search) {
      const q = filters.search.toLowerCase();
      const hay = `${p.name} ${p.operator || ''} ${p.city || ''} ${p.state || ''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }

  function sortProjects(arr) {
    const s = filters.sort;
    const cmp = {
      'mw-desc': (a,b) => (b.capacity_mw||0) - (a.capacity_mw||0),
      'mw-asc':  (a,b) => (a.capacity_mw||0) - (b.capacity_mw||0),
      'year-desc': (a,b) => (b.year_online||0) - (a.year_online||0),
      'year-asc':  (a,b) => (a.year_online||0) - (b.year_online||0),
      'name-asc':  (a,b) => a.name.localeCompare(b.name),
    }[s];
    return [...arr].sort(cmp);
  }

  // ---------- Render ----------
  const plistEl = document.getElementById('plist');
  const listCountEl = document.getElementById('list-count');

  function listItemHTML(p) {
    const typeShort = p.type === 'data_center' ? 'DC' : 'BESS';
    return `
      <div class="pitem ${p.type === 'bess' ? 'bess' : ''}" data-id="${p.id}">
        <div class="pname">${p.name}</div>
        <div class="pmeta">
          <span>${typeShort} · ${p.city}, ${p.state}${p.year_online ? ' · ' + p.year_online : ''}</span>
          <span><span class="pmw">${p.capacity_mw ? p.capacity_mw.toLocaleString() + ' MW' : '—'}</span></span>
        </div>
        <div class="pmeta" style="margin-top:3px;">
          <span style="color:var(--muted);">${p.operator || ''}</span>
          <span class="pstatus ${p.status}">${statusLabel(p.status).replace('Under Construction','UC')}</span>
        </div>
      </div>
    `;
  }

  function render() {
    cluster.clearLayers();
    let count = 0, mwSum = 0;
    const visible = [];
    allMarkers.forEach(m => {
      if (passes(m._project)) {
        cluster.addLayer(m);
        count++;
        mwSum += m._project.capacity_mw || 0;
        visible.push(m._project);
      }
    });
    document.getElementById('stat-count').textContent = count;
    document.getElementById('stat-count-sub').textContent = `of ${projects.length}`;
    document.getElementById('stat-mw').textContent = mwSum.toLocaleString();

    // List view
    const sorted = sortProjects(visible);
    listCountEl.textContent = `(${count})`;
    if (sorted.length === 0) {
      plistEl.innerHTML = '<div class="empty">No projects match the current filters.</div>';
    } else {
      plistEl.innerHTML = sorted.map(listItemHTML).join('');
    }
  }

  // ---------- List item click → fly + open popup ----------
  plistEl.addEventListener('click', e => {
    const item = e.target.closest('.pitem');
    if (!item) return;
    const id = item.dataset.id;
    const marker = markerById.get(id);
    if (!marker) return;
    const ll = marker.getLatLng();
    map.flyTo(ll, Math.max(map.getZoom(), 7), { duration: 0.6 });
    // Wait for fly to start unspiderfying clusters, then open
    setTimeout(() => {
      cluster.zoomToShowLayer(marker, () => marker.openPopup());
    }, 350);
  });

  // ---------- Wire controls ----------
  function wireChips(groupId, key) {
    const group = document.getElementById(groupId);
    group.addEventListener('click', e => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      group.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      filters[key] = chip.dataset.val;
      render();
    });
  }
  wireChips('filter-type', 'type');
  wireChips('filter-status', 'status');

  stateSel.addEventListener('change', e => {
    filters.state = e.target.value; render();
  });

  const mwInput = document.getElementById('filter-mw');
  const mwLabel = document.getElementById('filter-mw-val');
  mwInput.addEventListener('input', e => {
    filters.minMw = +e.target.value;
    mwLabel.textContent = `${filters.minMw}+ MW`;
    render();
  });

  function updateYearLabel() {
    yVal.textContent = `${filters.minYear}–${filters.maxYear}`;
  }
  yMin.addEventListener('input', () => {
    let mn = +yMin.value, mx = +yMax.value;
    if (mn > mx) { yMax.value = mn; mx = mn; }
    filters.minYear = mn; filters.maxYear = mx;
    updateYearLabel(); render();
  });
  yMax.addEventListener('input', () => {
    let mn = +yMin.value, mx = +yMax.value;
    if (mx < mn) { yMin.value = mx; mn = mx; }
    filters.minYear = mn; filters.maxYear = mx;
    updateYearLabel(); render();
  });

  const searchInput = document.getElementById('filter-search');
  searchInput.addEventListener('input', e => {
    filters.search = e.target.value.trim(); render();
  });

  const sortSel = document.getElementById('list-sort');
  sortSel.addEventListener('change', e => {
    filters.sort = e.target.value; render();
  });

  document.getElementById('reset').addEventListener('click', () => {
    filters.type = 'all';
    filters.status = 'all';
    filters.state = 'all';
    filters.minMw = 0;
    filters.minYear = minYear;
    filters.maxYear = maxYear;
    filters.search = '';
    document.querySelectorAll('#filter-type .chip, #filter-status .chip').forEach(c => {
      c.classList.toggle('active', c.dataset.val === 'all');
    });
    stateSel.value = 'all';
    mwInput.value = 0; mwLabel.textContent = '0+ MW';
    yMin.value = minYear; yMax.value = maxYear;
    searchInput.value = '';
    updateYearLabel();
    render();
  });

  updateYearLabel();
  render();
})();
</script>

</body>
</html>
